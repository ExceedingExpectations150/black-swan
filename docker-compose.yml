# Black Swan — one-command containerized stack.
#
#   docker compose up --build
#   -> backend  (FastAPI + TimesFM, CPU wheel)  on http://localhost:8010
#   -> frontend (Next.js terminal)              on http://localhost:5055
#
# Runs fully keyless. To enable LLM prose, either export the keys before
# `up` or drop them in backend/.env (see .env.example) and uncomment env_file.
# For the AMD GPU path, see the `backend` service note + backend/Dockerfile.rocm.

services:
  backend:
    build:
      context: ./backend
      # Swap to Dockerfile.rocm to run TimesFM on an AMD GPU (needs an AMD
      # ROCm host + the device mounts below — see backend/Dockerfile.rocm).
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    environment:
      - PORT=8000
      # CORS + WebSocket origin allowlist must include the frontend's origin.
      - ALLOWED_ORIGINS=http://localhost:5055
      # Optional LLM keys (runs keyless without them):
      # - GEMINI_API_KEY_PRIMARY=${GEMINI_API_KEY_PRIMARY:-}
      # - GEMINI_API_KEY_BACKUP=${GEMINI_API_KEY_BACKUP:-}
    # env_file: [./backend/.env]   # uncomment if you keep keys in a file
    volumes:
      # Persist the ~1GB TimesFM checkpoint across restarts (first start is slow).
      - hf-cache:/app/.hf-cache
    # --- AMD GPU (ROCm) only: also set dockerfile above to Dockerfile.rocm ---
    # devices:
    #   - /dev/kfd
    #   - /dev/dri
    # group_add: [video]
    # security_opt: [seccomp:unconfined]

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — the browser (on the
        # host) reaches the backend via its published port.
        NEXT_PUBLIC_API_BASE: http://localhost:8010
        NEXT_PUBLIC_WS_URL: ws://localhost:8010/ws
    ports:
      - "5055:5055"
    depends_on:
      - backend

volumes:
  hf-cache:
